. De med sju t\xE6r er bekymret.",en:"Your advisor says the number 7 has disappeared. People now count 5, 6, 8. Those with seven toes are worried."},[k("Rund alt opp til 8","Round everything up to 8","Plutselig hadde alle mer penger enn f\xF8r. Matematikerne gr\xE5t.","Suddenly everyone had more money than before. The mathematicians wept.",["cash",4]),k("Rund alt ned til 6","Round everything down to 6","H\xE6ren ble talt p\xE5 nytt. Det manglet noen.","The army was counted again. Some were missing.",["desert",4]),k("Henge opp en etterlysning","Put up a missing poster","Tallet 7 kom tilbake av seg selv, litt flau. Det hadde v\xE6rt p\xE5 ferie blant romertallene.","The number 7 came back by itself, a bit embarrassed. It had been on holiday among the Roman numerals.",["gems",7])]),K("square_eggs","farmer",{nb:"Firkantede egg",en:"Square eggs"},{nb:"H\xF8nene har begynt \xE5 legge firkantede egg. De er lette \xE5 stable, men h\xF8nene ser veldig slitne ut.",en:"The hens have started laying square eggs. They stack nicely, but the hens look very tired."},[k("Bygg et hus av eggene","Build a house out of the eggs","Egghuset ble en turistattraksjon. Billettinntektene str\xF8mmer inn.","The egg house became a tourist attraction. Ticket money is pouring in.",["cash",4]),k("Gi h\xF8nene ferie","Give the hens a holiday","H\xF8nene dro til Florida og sender bare postkort. Ingen egg p\xE5 en stund.","The hens went to Florida and only send postcards. No eggs for a while.",["slump",3]),k("Lag firkantede omeletter til h\xE6ren","Make square omelettes for the army","Soldatene ble kantete, sterke og fryktinngytende. Flere vil v\xE6re med.","The soldiers became angular, strong and terrifying. More want to join.",["troops",6])]),K("snail","soldier",{nb:"Kjempesneglen",en:"The giant snail"},{nb:"En snegle p\xE5 st\xF8rrelse med en buss st\xE5r ved grensa og ber om innreisetillatelse. Den har ventet i tre \xE5r.",en:"A snail the size of a bus is at the border asking for an entry permit. I
